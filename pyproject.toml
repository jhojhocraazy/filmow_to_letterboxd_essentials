[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filmow-to-letterboxd-essentials"
version = "0.1.0"
description = "ETL local para extrair o histórico público do Filmow e exportar CSV para Letterboxd e Trakt"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "jhojhocraazy" },
]
keywords = ["filmow", "letterboxd", "trakt", "csv", "etl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "cloudscraper>=1.2.71",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "rich>=13.7.0",
]

[project.scripts]
filmow-to-letterboxd-essentials = "filmow_to_letterboxd_essentials:main"

[tool.setuptools]
py-modules = [
  "filmow_to_letterboxd_essentials",
  "identity_matching",
  "tmdb_client",
]
